type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: 121212
  email:
    description: "Contact's mail"
    type: string
    example: 'contact@mail.com'
  iaFavourite:
    description: 'Whether the contact is in the favorites'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    description: "Link to contacts's photo"
    type: string
    example: <https://res.cloudinary.com/uqwgdu/image/upload/image.png>
  userId:
    description: "User id"
    type: string
    example: 65e4decdd286b30065d54af9

